name: Build APK

on:
  push:
    branches: [main]
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'android/**'
      - 'lib/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # No hard-pinned version: pinning rots (the pinned build disappears
          # from the channel index and CI stops resolving) and it silently
          # diverges from local `flutter` versions. Trade-off, documented in
          # NOTES.md (L9): stable is reproducible enough for a personal build,
          # and `flutter --version` is logged below for the record.
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-2.9-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
