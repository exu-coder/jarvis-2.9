org.gradle.jvmargs=-Xmx2560M -XX:MaxMetaspaceSize=768M -XX:ReservedCodeCacheSize=256M -XX:+UseSerialGC
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# aapt2 from Google Maven is x86_64; this arm64 host runs it via the qemu wrapper
android.aapt2FromMavenOverride=/opt/x86bin/aapt2
org.gradle.daemon=true
org.gradle.parallel=true
# 8-core phone, but limited RAM — cap workers to avoid OOM kills
org.gradle.workers.max=3
